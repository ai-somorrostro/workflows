name: Daily Activity Tracker

on:
  schedule:
    - cron: '59 23 * * *'  # 23:59 UTC daily
  workflow_dispatch:  # Manual trigger

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

jobs:
  collect-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Collect daily activity and create issue
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
        run: |
          set +e  # Don't exit on errors, handle them gracefully
          
          TODAY=$(date -u +%Y-%m-%d)
          TOMORROW=$(date -u -d "tomorrow" +%Y-%m-%d)
          
          REPORT_FILE=$(mktemp)
          
          echo "# Daily Activity Report - ${TODAY}" > "${REPORT_FILE}"
          echo "" >> "${REPORT_FILE}"
          echo "Generated at: $(date -u)" >> "${REPORT_FILE}"
          echo "" >> "${REPORT_FILE}"
          
          # Read repos from analized_repos.txt
          if [ ! -f "analized_repos.txt" ]; then
            echo "Error: analized_repos.txt not found"
            exit 1
          fi
          
          while IFS= read -r repo || [ -n "$repo" ]; do
            # Skip empty lines and comments
            [[ -z "$repo" || "$repo" =~ ^[[:space:]]*# ]] && continue
            
            echo "Processing repo: ${repo}"
            
            echo "## Repository: ${repo}" >> "${REPORT_FILE}"
            echo "" >> "${REPORT_FILE}"
            
            # Get commits from today
            echo "### Commits" >> "${REPORT_FILE}"
            COMMITS=$(gh api "/repos/${repo}/commits?since=${TODAY}T00:00:00Z&until=${TOMORROW}T00:00:00Z" \
              --jq '.[] | "- `\(.sha[0:7])` **\(.commit.author.name)**: \(.commit.message | split("\n")[0])"' 2>&1)
            
            if [ $? -eq 0 ] && [ -n "$COMMITS" ]; then
              echo "$COMMITS" >> "${REPORT_FILE}"
            else
              echo "- No commits today" >> "${REPORT_FILE}"
            fi
            echo "" >> "${REPORT_FILE}"
            
            # Get branch activity and merged PRs
            echo "### Branch Activity" >> "${REPORT_FILE}"
            
            # Get branches created today (with null check)
            BRANCHES=$(gh api "/repos/${repo}/branches" --paginate \
              --jq '.[] | select(.commit.commit.author.date != null and (.commit.commit.author.date | startswith("'${TODAY}'"))) | 
                     "- Created: **\(.name)** by \(.commit.commit.author.name)"' 2>&1)
            
            HAS_ACTIVITY=0
            if [ $? -eq 0 ] && [ -n "$BRANCHES" ]; then
              echo "$BRANCHES" >> "${REPORT_FILE}"
              HAS_ACTIVITY=1
            fi
            
            # Get merged PRs today
            MERGED_PRS=$(gh api "/repos/${repo}/pulls?state=closed&sort=updated&direction=desc" --paginate \
              --jq '.[] | select(.merged_at != null and (.merged_at | startswith("'${TODAY}'"))) | 
                     "- Merged PR #\(.number): **\(.title)** by \(.user.login) (merged by \(.merged_by.login))"' 2>&1)
            
            if [ $? -eq 0 ] && [ -n "$MERGED_PRS" ]; then
              echo "$MERGED_PRS" >> "${REPORT_FILE}"
              HAS_ACTIVITY=1
            fi
            
            if [ $HAS_ACTIVITY -eq 0 ]; then
              echo "- No branch activity detected" >> "${REPORT_FILE}"
            fi
            
            echo "" >> "${REPORT_FILE}"
            echo "---" >> "${REPORT_FILE}"
            echo "" >> "${REPORT_FILE}"
            
          done < analized_repos.txt
          
          echo "Report contents:"
          cat "${REPORT_FILE}"
          
          # Create issue without label (simpler and more reliable)
          gh issue create \
            --repo ${{ github.repository }} \
            --title "Daily Activity Report - ${TODAY}" \
            --body-file "${REPORT_FILE}"
          
          EXIT_CODE=$?
          rm -f "${REPORT_FILE}"
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "Issue created successfully!"
          else
            echo "Failed to create issue. Exit code: $EXIT_CODE"
            exit $EXIT_CODE
          fi
